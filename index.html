<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur de mots de passe sécurisés</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Générateur de mots de passe sécurisés</h1>
        <label for="length">Nombre de caractères :</label>
        <input type="number" id="length" min="4" max="32" value="12">
        <button id="generateBtn">Générer le mot de passe</button>
        <div id="result">
            <p>Votre mot de passe :</p>
            <p id="password"></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
